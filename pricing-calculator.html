<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Calculator | Small Business Tools</title>

    <meta
        name="description"
        content="Free pricing calculator for small businesses."
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        .header-inner {
            max-width: 800px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }

        h1 {
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .answer {
            text-align: center;
            background: #eff6ff;
            padding: 25px;
            border-radius: 12px;
        }

        .answer span {
            display: block;
            color: #64748b;
            margin-bottom: 8px;
        }

        .answer strong {
            font-size: 34px;
        }

        .explanation {
            line-height: 1.6;
            color: #475569;
        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <strong>
            Small Business Tools
        </strong>

        <a href="index.html">
            ← Home
        </a>

    </div>

</header>


<main>


    <div class="card">

        <h1>
            Pricing Calculator
        </h1>

        <p class="explanation">
            Calculate a recommended price based on your job expenses,
            labor, desired hourly pay, and target profit margin.
        </p>


        <div class="input-group">

            <label for="expenses">
                Job Expenses ($)
            </label>

            <input
                id="expenses"
                type="number"
                placeholder="100"
            >

        </div>


        <div class="input-group">

            <label for="hours">
                Hours Worked
            </label>

            <input
                id="hours"
                type="number"
                placeholder="4"
            >

        </div>


        <div class="input-group">

            <label for="hourly">
                Desired Pay Per Hour ($)
            </label>

            <input
                id="hourly"
                type="number"
                placeholder="40"
            >

        </div>


        <div class="input-group">

            <label for="margin">
                Desired Profit Margin (%)
            </label>

            <input
                id="margin"
                type="number"
                placeholder="20"
            >

        </div>


        <button onclick="calculatePrice()">
            Calculate Recommended Price
        </button>

    </div>


    <div class="card">

        <div class="answer">

            <span>
                Recommended Price
            </span>

            <strong id="price">
                $0.00
            </strong>

        </div>

    </div>


</main>


<script>

function calculatePrice() {


    const expenses =
        Number(document.getElementById("expenses").value) || 0;


    const hours =
        Number(document.getElementById("hours").value) || 0;


    const hourly =
        Number(document.getElementById("hourly").value) || 0;


    const margin =
        Number(document.getElementById("margin").value) || 0;


    const labor =
        hours * hourly;


    const baseCost =
        expenses + labor;


    const recommended =
        margin >= 100
        ? 0
        : baseCost / (1 - margin / 100);


    document.getElementById("price").textContent =
        "$" + recommended.toFixed(2);

}

</script>


</body>

</html>
