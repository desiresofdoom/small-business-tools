<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Profit Calculator | Small Business Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            <header>
    <div style="max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;">
        <strong>Small Business Tools</strong>

        <a href="index.html" style="color:white;text-decoration:none;">
            ← Home
        </a>
    </div>
</header>
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }

        .card h2 {
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .result {
            background: #f8fafc;
            border-radius: 10px;
            padding: 16px;
        }

        .result span {
            display: block;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result strong {
            font-size: 22px;
        }

        .profit {
            background: #ecfdf5;
        }

        @media (max-width: 600px) {
            .results {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Job Profit Calculator</h1>
    <p>Know exactly how profitable your next job will be.</p>
</header>

<main>

    <div class="card">
        <h2>Enter Job Information</h2>

        <div class="input-group">
            <label for="revenue">Customer Price ($)</label>
            <input id="revenue" type="number" placeholder="750">
        </div>

        <div class="input-group">
            <label for="materials">Materials ($)</label>
            <input id="materials" type="number" placeholder="120">
        </div>

        <div class="input-group">
            <label for="travel">Travel / Gas ($)</label>
            <input id="travel" type="number" placeholder="40">
        </div>

        <div class="input-group">
            <label for="other">Other Expenses ($)</label>
            <input id="other" type="number" placeholder="50">
        </div>

        <div class="input-group">
            <label for="hours">Hours Worked</label>
            <input id="hours" type="number" placeholder="6">
        </div>

        <button onclick="calculateProfit()">Calculate Profit</button>
    </div>

    <div class="card">
        <h2>Your Results</h2>

        <div class="results">

            <div class="result">
                <span>Revenue</span>
                <strong id="resultRevenue">$0.00</strong>
            </div>

            <div class="result">
                <span>Total Expenses</span>
                <strong id="resultExpenses">$0.00</strong>
            </div>

            <div class="result profit">
                <span>Net Profit</span>
                <strong id="resultProfit">$0.00</strong>
            </div>

            <div class="result">
                <span>Profit Margin</span>
                <strong id="resultMargin">0%</strong>
            </div>

            <div class="result">
                <span>Profit Per Hour</span>
                <strong id="resultHourly">$0.00</strong>
            </div>

        </div>
    </div>

</main>

<script>
    function calculateProfit() {

        const revenue =
            Number(document.getElementById("revenue").value) || 0;

        const materials =
            Number(document.getElementById("materials").value) || 0;

        const travel =
            Number(document.getElementById("travel").value) || 0;

        const other =
            Number(document.getElementById("other").value) || 0;

        const hours =
            Number(document.getElementById("hours").value) || 0;

        const expenses = materials + travel + other;

        const profit = revenue - expenses;

        const margin =
            revenue > 0 ? (profit / revenue) * 100 : 0;

        const hourly =
            hours > 0 ? profit / hours : 0;

        document.getElementById("resultRevenue").textContent =
            "$" + revenue.toFixed(2);

        document.getElementById("resultExpenses").textContent =
            "$" + expenses.toFixed(2);

        document.getElementById("resultProfit").textContent =
            "$" + profit.toFixed(2);

        document.getElementById("resultMargin").textContent =
            margin.toFixed(1) + "%";

        document.getElementById("resultHourly").textContent =
            "$" + hourly.toFixed(2);
    }
</script>

</body>
</html>
